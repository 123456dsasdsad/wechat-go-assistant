name: Go checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -mod=vendor ./...
      - run: go vet -mod=vendor ./...
      - if: runner.os == 'Linux'
        run: go test -mod=vendor -race ./cmd/worker ./cmd/relay ./internal/jobs ./internal/conversations ./internal/maintenance ./internal/files ./internal/settings ./internal/assistant ./internal/library ./internal/scholar ./internal/materials ./internal/workerpermits ./internal/userinput ./internal/personalwechat
      - if: runner.os == 'Linux'
        run: python3 -m unittest discover -s deploy/maintenance -p 'test_*.py'
      - run: python -B -m unittest discover -s apps/research-writing/tests -v
      - run: python -B -m unittest discover -s deploy/cluster -v
      - if: runner.os == 'Windows'
        run: pwsh -NoProfile -File deploy/maintenance/test_windows_accounts.ps1

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go build -mod=vendor ./cmd/weixin ./cmd/relay ./cmd/worker ./cmd/maintenance ./cmd/retry ./cmd/storageprobe ./cmd/wechat-personal

  research-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
        working-directory: apps/research-writing/frontend
      - run: npm run build
        working-directory: apps/research-writing/frontend
