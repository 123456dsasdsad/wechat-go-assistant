<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上传 Cockpit 账号</title>
<style>
:root{--paper:#f5f8fa;--ink:#19313c;--muted:#566d79;--line:#d1dde3;--green:#14794b;--white:#fff;--error:#a42632}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}main{max-width:540px;margin:auto;padding:30px 22px 48px}.brand{font-size:14px;color:var(--muted)}h1{font-size:30px;line-height:1.3;letter-spacing:-.02em;margin:28px 0 14px}p{color:var(--muted);margin:0 0 22px}.behavior{display:flex;gap:20px;padding:16px 0;border-block:1px solid var(--line);margin:24px 0}.behavior span{flex:1}.behavior strong{display:block;font-size:17px}.behavior small{display:block;color:var(--muted)}form{margin-top:26px}label{display:block;font-weight:600;margin-bottom:10px}input{width:100%;font:inherit;padding:12px 0;color:var(--ink)}input::file-selector-button{border:1px solid var(--line);background:var(--white);border-radius:7px;color:var(--ink);font:inherit;padding:10px 12px;margin-right:12px}button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:8px;background:var(--green);color:var(--white);font-family:inherit;font-weight:600;font-size:17px;line-height:1.5;cursor:pointer}button:disabled{opacity:.6;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #157fa6;outline-offset:3px}small{font-size:13px}#status{margin-top:20px;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:var(--error)}progress{width:100%;accent-color:var(--green);margin-top:18px}.receipt{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.receipt h2{font-size:21px;margin:0 0 14px}dl{margin:0}dl div{display:flex;justify-content:space-between;gap:20px;padding:8px 0;border-bottom:1px solid var(--line)}dt{color:var(--muted)}dd{margin:0;font-weight:600}footer{font-size:13px;color:var(--muted);margin-top:26px}[hidden]{display:none!important}@media(max-width:360px){main{padding-inline:16px}h1{font-size:27px}.behavior{gap:12px}}
</style></head>
<body><main><div class="brand">校园 · 微信助手 / Cockpit</div><h1>把账号加进共享池。</h1><p>选择 Codex 账号的 JSON 导出文件。上传完成后自动合并，结果会显示在这里。</p><div class="behavior"><span><strong>已有账号</strong><small>更新凭据，保留原设置</small></span><span><strong>新的账号</strong><small>添加到共享账号池</small></span></div><form id="form"><label for="file">选择账号 JSON</label><input id="file" type="file" accept=".json,application/json" required aria-describedby="hint"><small id="hint">支持单个账号、账号数组和包含 accounts 的导出文件。</small><button id="submit" type="submit" disabled>上传并合并账号</button></form><progress id="progress" max="100" value="0" hidden aria-label="上传进度"></progress><div id="status" role="status" aria-live="polite">正在验证上传链接…</div><section id="receipt" class="receipt" hidden><h2 id="phase">已接收账号</h2><dl><div><dt>批次</dt><dd id="batch"></dd></div><div><dt>接收账号</dt><dd id="count"></dd></div><div id="changes" hidden><dt>合并结果</dt><dd id="summary"></dd></div><div id="total-row" hidden><dt>共享池总数</dt><dd id="total"></dd></div></dl></section><footer>若 AI 任务正在执行，账号会先保存，任务结束后自动启用。<br>链接有效期 30 分钟；过期后在微信发送“上传账号”获取新链接。<br>账号导入由程序直接处理，不消耗模型 token。</footer></main>
<script>
const $=id=>document.getElementById(id);let authorized=false,activeBatch='',timer=null;
function show(text,error=false){$('status').textContent=text;$('status').className=error?'error':''}
function render(r,message){activeBatch=r.id;$('receipt').hidden=false;$('batch').textContent=r.id.slice(0,8);$('count').textContent=r.account_count+(r.duplicates?'（合并 '+r.duplicates+' 个重复项）':'');$('phase').textContent=({pending:'账号已接收',applied:'已合并，正在启用',active:'账号已生效',failed:'导入未完成'})[r.status]||'处理账号';const applied=r.status==='applied'||r.status==='active';$('changes').hidden=!applied;$('total-row').hidden=!applied;$('summary').textContent='新增 '+r.added+' · 更新 '+r.updated;$('total').textContent=r.total;show(message||({pending:'已保存。当前任务结束后自动合并并启用。',applied:'凭据已更新，正在启用共享账号池。',active:'已生效，可用于后续任务。',failed:'导入失败，现有账号已保留。请检查 JSON 后获取新链接上传。'})[r.status],r.status==='failed');clearTimeout(timer);if(r.status==='pending'||r.status==='applied')timer=setTimeout(poll,5000)}
async function poll(){try{const response=await fetch('./status?id='+encodeURIComponent(activeBatch));if(!response.ok)throw Error(await response.text());const data=await response.json();render(data.receipt,data.message)}catch(e){show(e.message||'状态暂时无法读取。可在微信发送“上传账号状态”查看。',true)}}
async function start(){let token=location.hash.slice(1);history.replaceState(null,'',location.pathname);try{if(token){const r=await fetch('./session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});token='';if(!r.ok)throw Error(await r.text())}const check=await fetch('./status');if(!check.ok)throw Error(await check.text());const data=await check.json();authorized=true;$('submit').disabled=false;show('链接已验证，可以选择账号 JSON。');if(data.receipts&&data.receipts.length)render(data.receipts[0])}catch(e){token='';show(e.message||'连接失败，请在微信获取新的账号上传链接。',true)}}
$('form').addEventListener('submit',event=>{event.preventDefault();const file=$('file').files[0];if(!authorized||!file)return;if(!file.name.toLowerCase().endsWith('.json')){show('请选择 .json 账号导出文件。',true);return}const form=new FormData();form.append('file',file);$('submit').disabled=true;$('receipt').hidden=true;$('progress').hidden=false;$('progress').value=0;clearTimeout(timer);show('正在上传，请保持页面打开。');const request=new XMLHttpRequest();request.open('POST','./upload');request.upload.onprogress=e=>{if(e.lengthComputable)$('progress').value=100*e.loaded/e.total};request.onload=()=>{$('submit').disabled=false;$('progress').hidden=true;if(request.status!==200){show(request.responseText||'上传失败，请重试。',true);return}try{const result=JSON.parse(request.responseText);render(result.receipt,result.message)}catch(e){show('上传结果暂时无法读取。可在微信发送“上传账号状态”确认。',true)}};request.onerror=()=>{$('submit').disabled=false;$('progress').hidden=true;show('网络中断，请重新上传同一文件。重试不会重复添加账号。',true)};request.send(form)});start();
</script></body></html>
