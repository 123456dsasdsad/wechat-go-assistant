<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cockpit 账号管理</title>
<style>:root{--paper:#f5f8fa;--ink:#19313c;--muted:#566d79;--line:#d1dde3;--green:#14794b;--white:#fff;--error:#a42632}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}main{max-width:540px;margin:auto;padding:30px 22px 48px}.brand{font-size:14px;color:var(--muted)}h1{font-size:30px;line-height:1.3;letter-spacing:-.02em;margin:28px 0 14px}p{color:var(--muted);margin:0 0 22px}.behavior{display:flex;gap:20px;padding:16px 0;border-block:1px solid var(--line);margin:24px 0}.behavior span{flex:1}.behavior strong{display:block;font-size:17px}.behavior small{display:block;color:var(--muted)}form{margin-top:26px}label{display:block;font-weight:600;margin-bottom:10px}input{width:100%;font:inherit;padding:12px 0;color:var(--ink)}input::file-selector-button{border:1px solid var(--line);background:var(--white);border-radius:7px;color:var(--ink);font:inherit;padding:10px 12px;margin-right:12px}button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:8px;background:var(--green);color:var(--white);font-family:inherit;font-weight:600;font-size:17px;line-height:1.5;cursor:pointer}button:disabled{opacity:.6;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #157fa6;outline-offset:3px}small{font-size:13px}#status{margin-top:20px;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:var(--error)}progress{width:100%;accent-color:var(--green);margin-top:18px}.receipt{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.receipt h2{font-size:21px;margin:0 0 14px}dl{margin:0}dl div{display:flex;justify-content:space-between;gap:20px;padding:8px 0;border-bottom:1px solid var(--line)}dt{color:var(--muted)}dd{margin:0;font-weight:600}footer{font-size:13px;color:var(--muted);margin-top:26px}[hidden]{display:none!important}@media(max-width:360px){main{padding-inline:16px}h1{font-size:27px}.behavior{gap:12px}}
.accounts{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px}.section-head h2{font-size:21px;margin:0}.secondary,.delete{width:auto;margin:0;padding:8px 12px;font-size:14px;background:var(--white);border:1px solid var(--line);color:var(--ink)}.delete{color:var(--error);border-color:#dec3c7;flex-shrink:0}.account{display:flex;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}.account-info{flex:1;min-width:0}.account-email{font-weight:600;overflow-wrap:anywhere}.account-detail{color:var(--muted);font-size:13px;overflow-wrap:anywhere}#account-status{color:var(--muted);font-size:14px;margin:12px 0 0}
</style></head>
<body><main>
<div class="brand">校园 · 微信助手 / Cockpit</div><h1>管理共享账号池。</h1><p>上传 JSON 添加或更新账号，也可以在下方选择账号手动删除。</p>
<div class="behavior"><span><strong>已有账号</strong><small>更新凭据，保留原设置</small></span><span><strong>新的账号</strong><small>添加到共享账号池</small></span></div>
<form id="form"><label for="file">选择账号 JSON</label><input id="file" type="file" accept=".json,application/json" required aria-describedby="hint"><small id="hint">支持单个账号、账号数组和包含 accounts 的导出文件。</small><button id="submit" type="submit" disabled>上传并合并账号</button></form>
<progress id="progress" max="100" value="0" hidden aria-label="上传进度"></progress><div id="status" role="status" aria-live="polite">正在验证管理链接…</div>
<section id="receipt" class="receipt" hidden><h2 id="phase">已接收操作</h2><dl><div><dt>批次</dt><dd id="batch"></dd></div><div><dt id="count-label">接收账号</dt><dd id="count"></dd></div><div id="changes" hidden><dt>处理结果</dt><dd id="summary"></dd></div><div id="total-row" hidden><dt>共享池总数</dt><dd id="total"></dd></div></dl></section>
<section id="accounts" class="accounts" hidden aria-labelledby="accounts-title"><div class="section-head"><h2 id="accounts-title">当前账号</h2><button id="refresh" class="secondary" type="button">刷新</button></div><div id="account-status" role="status" aria-live="polite"></div><div id="account-list"></div></section>
<footer>任务执行中会先保存操作，账号池空闲后自动生效。<br>链接有效期 30 分钟；过期后在微信发送“管理账号”或“上传账号”获取新链接。<br>上传、更新和删除均由程序直接处理，不消耗模型 token。</footer>
</main>
<script>
const $=id=>document.getElementById(id);let authorized=false,activeBatch='',timer=null,listBusy=false,deleteBusy=false;
function show(text,error=false){$('status').textContent=text;$('status').className=error?'error':''}
function render(r,message){
 activeBatch=r.id;const removing=r.operation==='delete';
 $('receipt').hidden=false;$('batch').textContent=r.id.slice(0,8);$('count-label').textContent=removing?'选择账号':'接收账号';$('count').textContent=r.account_count+(r.duplicates?'（合并 '+r.duplicates+' 个重复项）':'');
 const phases=removing?{pending:'删除请求已接收',applied:'已移除，等待网关启用',active:'删除已生效',failed:'删除未完成'}:{pending:'账号已接收',applied:'已合并，正在启用',active:'账号已生效',failed:'导入未完成'};
 $('phase').textContent=phases[r.status]||'处理账号';const applied=r.status==='applied'||r.status==='active';$('changes').hidden=!applied;$('total-row').hidden=!applied;$('summary').textContent=removing?'删除 '+r.deleted:'新增 '+r.added+' · 更新 '+r.updated;$('total').textContent=r.total;
 show(message||phases[r.status],r.status==='failed');clearTimeout(timer);if(r.status==='pending'||r.status==='applied')timer=setTimeout(poll,5000);if(authorized)loadAccounts();
}
async function poll(){const id=activeBatch;try{const r=await fetch('./status?id='+encodeURIComponent(id));if(!r.ok)throw Error(await r.text());const data=await r.json();if(activeBatch===id)render(data.receipt,data.message)}catch(e){if(activeBatch===id)show(e.message||'状态暂时无法读取，请稍后刷新。',true)}}
async function loadAccounts(){
 if(!authorized||listBusy)return;listBusy=true;$('accounts').hidden=false;$('refresh').disabled=true;
 try{const r=await fetch('./list');if(!r.ok)throw Error(await r.text());const data=await r.json();$('account-list').replaceChildren();$('account-status').textContent=data.accounts.length?'共 '+data.accounts.length+' 个账号':'账号池为空。可在上方上传 JSON 添加账号。';
 for(const account of data.accounts){
  const row=document.createElement('div');row.className='account';const info=document.createElement('div');info.className='account-info';
  const email=document.createElement('div');email.className='account-email';email.textContent=account.email||'未提供邮箱';
  const detail=document.createElement('div');detail.className='account-detail';detail.textContent=(account.plan||'套餐未知')+' · '+account.id.slice(0,8)+(account.pending_delete?' · 等待删除生效':account.disabled?' · 已停用':'');
  const button=document.createElement('button');button.type='button';button.className='delete';button.textContent=account.pending_delete?'待删除':'删除';button.disabled=account.pending_delete||deleteBusy;button.addEventListener('click',()=>deleteAccount(account));
  info.append(email,detail);row.append(info,button);$('account-list').append(row);
 }}catch(e){$('account-status').textContent=e.message||'账号列表暂时无法读取，请稍后刷新。'}finally{listBusy=false;$('refresh').disabled=false}
}
async function deleteAccount(account){
 if(deleteBusy||!authorized)return;
 if(!confirm('确认删除这个账号？\n\n'+(account.email||'未提供邮箱')+'\n套餐：'+(account.plan||'未知')+'\n编号：'+account.id.slice(0,8)+'\n\n将移出账号池并删除登录凭据。任务执行中会等待空闲后生效。'))return;
 deleteBusy=true;document.querySelectorAll('.delete').forEach(button=>button.disabled=true);
 const requestID=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');
 try{const r=await fetch('./delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account_ids:[account.id],request_id:requestID})});if(!r.ok)throw Error(await r.text());const data=await r.json();render(data.receipt,data.message)}
 catch(e){show(e.message||'删除请求未完成，请刷新列表后重试。',true)}finally{deleteBusy=false;await loadAccounts()}
}
async function start(){let token=location.hash.slice(1);history.replaceState(null,'',location.pathname);try{if(token){const r=await fetch('./session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});token='';if(!r.ok)throw Error(await r.text())}const check=await fetch('./status');if(!check.ok)throw Error(await check.text());const data=await check.json();authorized=true;$('submit').disabled=false;show('链接已验证，可以上传或删除账号。');if(data.receipts&&data.receipts.length)render(data.receipts[0]);else await loadAccounts()}catch(e){token='';show(e.message||'连接失败，请在微信获取新的账号管理链接。',true)}}
$('refresh').addEventListener('click',loadAccounts);
$('form').addEventListener('submit',event=>{event.preventDefault();const file=$('file').files[0];if(!authorized||!file)return;if(!file.name.toLowerCase().endsWith('.json')){show('请选择 .json 账号导出文件。',true);return}const form=new FormData();form.append('file',file);$('submit').disabled=true;$('receipt').hidden=true;$('progress').hidden=false;$('progress').value=0;clearTimeout(timer);show('正在上传，请保持页面打开。');const request=new XMLHttpRequest();request.open('POST','./upload');request.upload.onprogress=e=>{if(e.lengthComputable)$('progress').value=100*e.loaded/e.total};request.onload=()=>{$('submit').disabled=false;$('progress').hidden=true;if(request.status!==200){show(request.responseText||'上传失败，请重试。',true);return}try{const result=JSON.parse(request.responseText);render(result.receipt,result.message)}catch(e){show('上传结果暂时无法读取。可在微信发送“上传账号状态”确认。',true)}};request.onerror=()=>{$('submit').disabled=false;$('progress').hidden=true;show('网络中断，请重新上传同一文件。重试不会重复添加账号。',true)};request.send(form)});start();
</script></body></html>
